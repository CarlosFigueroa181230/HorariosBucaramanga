<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Editor</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- XLSX library for Excel parsing and writing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Editor de Excel</h1>
        <p>Edita las tablas que has importado anteriormente</p>
        
        <div id="fileListSection" style="display:none;" class="converter-section">
            <div style="flex: 1;">
                <label for="savedFileSelect" style="display: block; margin-bottom: 10px; font-weight: 600;">Selecciona una tabla guardada:</label>
                <select id="savedFileSelect"></select>
            </div>
            <button id="loadFileBtn">Cargar para Editar</button>
            <button id="deleteFileBtn" class="delete-btn">🗑️ Eliminar tabla</button>
        </div>
        
        <div id="noFilesMessage" class="converter-section" style="text-align: center; color: #999;">
            <p>No hay tablas guardadas. Por favor, importa una tabla desde <a href="../P1_WebTable/index.html">Excel a Tabla</a> primero.</p>
        </div>
        
        <div id="outputSection" style="display:none;" class="output-section">
            <div class="table-controls">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                    <div>
                        <h2 id="fileNameDisplay" style="margin: 0; color: #667eea;">Datos Cargados:</h2>
                    </div>
                    <div class="button-group">
                        <button id="exportBtn" class="export-btn">📥 Descargar Excel editado</button>
                        <button id="addRowBtn" class="add-row-btn">➕ Agregar fila</button>
                        <button id="backBtn" class="back-btn">← Volver a tablas guardadas</button>
                        <span id="sheetSelector" style="display:none;">
                            <label for="sheetSelect">Hoja:</label>
                            <select id="sheetSelect"></select>
                        </span>
                    </div>
                </div>
            </div>
            <div id="tableOutput" class="table-wrapper"></div>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
    </div>
    
    <script src="js/scriptEdicion.js"></script>
</body>
</html>
