<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios - Login</title>
    <!-- Link al archivo CSS externo -->
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <!-- Contenedor principal -->
    <div class="container">
        
        <!-- Encabezado del login -->
        <div class="login-header">
            <!-- Logo UPB -->
            <div class="logo-container">
                <img src="logo-upb.png" alt="Logo UPB" class="logo">
            </div>
            <h1>Bienvenido a la página de<br>Horarios Versión 2.0</h1>
            <p>Por favor ingrese para administrar los horarios</p>
        </div>

        <!-- Formulario -->
        <form onsubmit="irAAdmin(event)">
            <!-- Campo de usuario -->
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ingrese con su nombre de usuario" required>
            </div>

            <!-- Campo de contraseña -->
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="" required>
            </div>

            <!-- Checkbox Recuérdame -->
            <div class="remember-group">
                <label for="remember">
                    <input type="checkbox" id="remember">
                    Recuérdame
                </label>
            </div>

            <!-- Botón de ingresar -->
            <button type="submit" class="login-btn">Ingresar</button>

            <!-- Texto de autorización -->
            <div class="auth-text">
                Si no es un usuario Autorizado <a href="#">Comuníquese con el CTIC</a>
            </div>

            <!-- Link a página principal -->
            <div class="main-link">
                <a href="#">O vaya a la página principal</a>
            </div>
        </form>
    </div>

    <!-- JavaScript -->
    <script>
        /* Función para ir a la página de administración */
        function irAAdmin(event) {
            event.preventDefault();
            
            // Validar que los campos no estén vacíos
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username.trim() === '' || password.trim() === '') {
                alert('Por favor ingrese usuario y contraseña');
                return;
            }
            
            // Redirigir a la página de administración
            window.location.href = './admin.html';
        }
    </script>

</body>
</html>
